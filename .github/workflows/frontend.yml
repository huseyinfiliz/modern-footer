name: Frontend Tests

on:
  push:
    branches: [1.x, 2.x]
  pull_request:
    branches: [1.x, 2.x]
  workflow_dispatch:

jobs:
  build:
    name: Frontend Build & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: js/yarn.lock

      - name: Install JS dependencies
        run: |
          cd js
          yarn install --frozen-lockfile

      - name: Build frontend
        run: |
          cd js
          yarn build

      - name: Check formatting
        run: |
          cd js
          yarn format-check || echo "Prettier check skipped"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: js/dist/
          retention-days: 7